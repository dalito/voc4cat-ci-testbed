# Throwaway probe: does the OLD pipeline's mechanism (pull_request_target +
# checkout of the fork + push with GITHUB_TOKEN) work for a cross-org fork?
# Answers whether the ci-pr/ci-pr-commit split regressed fork support or
# whether GITHUB_TOKEN never could push to a fork. Delete after use.
name: Fork push probe
on:
  # zizmor: ignore[dangerous-triggers] throwaway probe in a testbed repo
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the PR head from the fork, as the old pipeline did
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Try to push a commit to the PR branch
        run: |
          echo "probe $GITHUB_RUN_ID" > ci-push-probe.txt
          git -c user.name='probe' -c user.email='probe@example.com' \
              add ci-push-probe.txt
          git -c user.name='probe' -c user.email='probe@example.com' \
              commit -m "Probe push from the base repository"
          git push origin "HEAD:${{ github.head_ref }}"
